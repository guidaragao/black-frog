# Publica o site no GitHub Pages a cada push na main.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build estatico
        env:
          GITHUB_PAGES: "true"
          # o Pages serve o projeto em /<nome-do-repo>, entao o site
          # precisa saber esse prefixo pra os links e assets nao quebrarem
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build
      - name: .nojekyll
        # sem isso o Pages ignora as pastas _next do Next.js
        run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
